<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ea580c" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Brand Symbol: Modern Architectural Skyline + Map Pin + Compass -->
  <g filter="url(#glow)">
    <!-- Central Tower (Taller) -->
    <path d="M 216 140 L 296 140 L 296 380 L 216 380 Z" fill="url(#accentGrad)"/>
    <path d="M 256 90 L 296 140 L 216 140 Z" fill="url(#goldGrad)"/>
    <!-- Left Building -->
    <path d="M 136 210 L 206 170 L 206 380 L 136 380 Z" fill="#c2410c" opacity="0.9"/>
    <!-- Right Building -->
    <path d="M 306 190 L 376 230 L 376 380 L 306 380 Z" fill="#9a3412" opacity="0.9"/>

    <!-- Building Windows Grid -->
    <!-- Tower Windows -->
    <rect x="236" y="165" width="16" height="20" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="260" y="165" width="16" height="20" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="236" y="200" width="16" height="20" rx="3" fill="#ffffff" opacity="0.85"/>
    <rect x="260" y="200" width="16" height="20" rx="3" fill="#ffffff" opacity="0.85"/>
    <rect x="236" y="235" width="16" height="20" rx="3" fill="#ffffff" opacity="0.85"/>
    <rect x="260" y="235" width="16" height="20" rx="3" fill="#ffffff" opacity="0.85"/>
    <rect x="236" y="270" width="16" height="20" rx="3" fill="#ffffff" opacity="0.85"/>
    <rect x="260" y="270" width="16" height="20" rx="3" fill="#ffffff" opacity="0.85"/>
    <rect x="236" y="305" width="16" height="20" rx="3" fill="#ffffff" opacity="0.85"/>
    <rect x="260" y="305" width="16" height="20" rx="3" fill="#ffffff" opacity="0.85"/>
    
    <!-- Left windows -->
    <rect x="156" y="230" width="14" height="18" rx="2" fill="#fed7aa" opacity="0.75"/>
    <rect x="178" y="220" width="14" height="18" rx="2" fill="#fed7aa" opacity="0.75"/>
    <rect x="156" y="260" width="14" height="18" rx="2" fill="#fed7aa" opacity="0.75"/>
    <rect x="178" y="250" width="14" height="18" rx="2" fill="#fed7aa" opacity="0.75"/>
    <rect x="156" y="290" width="14" height="18" rx="2" fill="#fed7aa" opacity="0.75"/>
    <rect x="178" y="280" width="14" height="18" rx="2" fill="#fed7aa" opacity="0.75"/>

    <!-- Right windows -->
    <rect x="320" y="230" width="14" height="18" rx="2" fill="#fed7aa" opacity="0.75"/>
    <rect x="344" y="245" width="14" height="18" rx="2" fill="#fed7aa" opacity="0.75"/>
    <rect x="320" y="265" width="14" height="18" rx="2" fill="#fed7aa" opacity="0.75"/>
    <rect x="344" y="280" width="14" height="18" rx="2" fill="#fed7aa" opacity="0.75"/>
    <rect x="320" y="300" width="14" height="18" rx="2" fill="#fed7aa" opacity="0.75"/>
    <rect x="344" y="315" width="14" height="18" rx="2" fill="#fed7aa" opacity="0.75"/>
  </g>

  <!-- Ground platform beam with glowing gradient -->
  <rect x="110" y="380" width="292" height="14" rx="7" fill="url(#goldGrad)"/>

  <!-- GIS Radar Ring / Location Compass Emblem in Bottom Center -->
  <circle cx="256" cy="425" r="20" fill="none" stroke="#f97316" stroke-width="4" opacity="0.8"/>
  <circle cx="256" cy="425" r="7" fill="#fb923c"/>
  <path d="M 230 425 L 246 425 M 266 425 L 282 425 M 256 399 L 256 415 M 256 435 L 256 451" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
</svg>
